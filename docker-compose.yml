version: "3.9"

services:
  english-buddy-1:
    build: .
    container_name: english-buddy-1
    restart: unless-stopped
    environment:
      - PORT=8081
    expose:
      - "8081"
    networks:
      - english-buddy-net

  english-buddy-2:
    build: .
    container_name: english-buddy-2
    restart: unless-stopped
    environment:
      - PORT=8082
    expose:
      - "8082"
    networks:
      - english-buddy-net

  nginx:
    image: nginx:alpine
    container_name: english-buddy-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - english-buddy-1
      - english-buddy-2
    networks:
      - english-buddy-net

networks:
  english-buddy-net:
    driver: bridge
